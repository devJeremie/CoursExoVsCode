<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feu tricolore</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section><!--Feu tricolore-->
        <div class="container">
            <div class="light green"></div>
            <div class="light orange"></div>
            <div class="light red"></div>
        </div>
    </section>
    <section><!--Modal-->
        <div>
            <button id="ouvrir-modal">Ouvrir la modale</button>
            <div id="modale" class="modale">
              <div class="contenu-modale">
                <span class="fermer-modale">×</span>
                <h2>Titre de la modale</h2>
                <p>Contenu de la modale.</p>
              </div>
            </div>
        </div>
    </section>
    <!--Exemple classe qui dit bonjour-->
    <section>
        <script>
            class Calculateur {
                    // Le constructeur initialise la donnée de notre objet
                    constructor(valeurInitiale) {
                        this.total = valeurInitiale;
                    }
                    // Fonction 1 : Modifie la donnée
                    ajouter(nombre) {
                        this.total += nombre;
                    }
                    // Fonction 2 : Affiche la donnée
                    afficher() {
                        console.log(`Le total actuel est : ${this.total}`);
                    }
                }
                // Utilisation
                const monCalcul = new Calculateur(20); // On initialise à 20
                monCalcul.ajouter(2);                  // On ajoute 2
                monCalcul.afficher();                  // Affiche : Le total actuel est : 22
        </script>
    </section>
    <script src="index.js"></script>
</body>
</html>
